[package]
name = "aproxy-desktop"
# 与 aproxy 主线同步发版：aproxy 的 `desktop` 特性就是对本包的可选依赖（path + version），
# 两者总是一起改版本号、一起发布（发布顺序本包在前）。
version = "0.2.0-alpha.0"
edition = "2024"
# tauri 一族（tauri、tauri-build、codegen、macros、utils、runtime-wry，以及 muda、tray-icon）
# 都声明 rust-version 1.90，本包的实际下限就是它。
rust-version = "1.90"
description = "Desktop window (Tauri 2) of aproxy, with its embedded web front end"
license = "MIT"
authors = ["aProxy Contributors"]
repository = "https://github.com/MoYeRanqianzhi/aProxy"
keywords = ["aproxy", "tauri", "desktop"]
categories = ["gui"]
# crates.io 白名单。前端源码（ui/）不进包：用户 `cargo install aproxy` 时不需要 Node.js，
# 编进二进制的是构建好的 dist/。dist/ 被 .gitignore 忽略，但写了 include 之后 cargo 不再
# 按 gitignore 排除文件，所以照样进包——发布前必须先构建前端（build.rs 在 dist 缺失时报错，
# 不会拿空界面凑数）。用 `cargo package --list -p aproxy-desktop` 核对。
#
# gen/schemas/ 也进包，它同样被 .gitignore 忽略：tauri-build 每次构建都往包根写这几个 ACL
# schema（acl-manifests.json、capabilities.json、desktop-schema.json、<平台>-schema.json，
# 平台是 windows、linux、macOS 之一），`cargo package` 与 `cargo publish` 的校验构建在解包目录
# 里也写。包里没有它们时，cargo 以「Source directory was modified by build.rs」拒绝
# （2026-10-12 实测）；包里带着同一平台上构建出来的这几个文件，校验构建写出的内容逐字节
# 相同（tauri-utils 内容不变就不重写，cargo 比的是内容哈希），就不算改动（2026-10-12 在
# Windows 上实测通过）。所以打包之前，要先在执行打包的这个平台上构建一次本包，让
# gen/schemas/ 里有这个平台的文件——release.yml 的 publish-crates 就是这样做的。
include = [
    "/src/**",
    "/build.rs",
    "/Cargo.toml",
    "/tauri.conf.json",
    "/capabilities/**",
    # 本包命令的权限定义：build.rs 的 app manifest 生成，内容不变就不重写，随仓库提交。
    # 包里带着它们，tauri-build 在解包出来的源码目录里就不必再写一遍
    "/permissions/**",
    "/icons/**",
    "/dist/**",
    # 见上面的说明：在打包的平台上先构建一次本包才有这个平台的文件
    "/gen/schemas/**",
]

# 不跑单元测试与文档测试：本包没有测试。默认 test = true 时，即使一个测试都没有，cargo 也会
# 构建并运行一个链接 Tauri 的空测试程序；关掉它，`cargo test --workspace` 在 Windows 上就不必
# 依赖 Common-Controls 清单怎样传给测试程序（RT-05，tauri#13419：缺清单而又静态导入了 v6 专有
# 函数的测试程序在 main 之前以 0xC0000139 退出）。逻辑尽量放在不链接 Tauri 的地方测试。
[lib]
test = false
doctest = false

[dependencies]
# default-features = false 是为了关掉 common-controls-v6：它让 exe 静态导入只有 Common
# Controls v6 才有的 TaskDialogIndirect，没有 v6 清单的 exe 在 main 之前就以 0xC0000139
# 退出——连 `aproxy --version`（永久兼容契约 C5）都跑不了。清单在 tauri-build 编出的 Windows
# 资源里：本包只有 lib，embed-resource 退而经 `rustc-link-lib` 发布资源，链接本包的 exe 都
# 带上它，所以 aproxy.exe 现在有清单、图标与版本信息（2026-10-12 核对过）。可本包一旦有了
# bin，资源就改为经 rustc-link-arg-bins 只给那个 bin（tauri#13948），aproxy.exe 随之悄悄失去
# 清单。关掉之后 exe 不依赖清单也能启动（系统目录里 v5.82 的 comctl32 照样导出 Tauri 与自定义
# 标题栏用到的 SetWindowSubclass 一族），About 与「缺 WebView2」对话框降级为普通 MessageBox。
# dynamic-acl（运行时增加 capability）也随之关掉，用不到。
# - wry：webview 运行时；
# - compression：嵌入的前端资源用 brotli 压缩；
# - custom-protocol：从嵌入的资源加载界面（generate_context! 的 dev 标志取它的反面），
#   不连开发服务器。
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "custom-protocol"] }
# 自定义标题栏的 titlebar_insets 返回值要序列化给前端
serde = { version = "1", features = ["derive"] }
# 只为接收 aproxy 建好的 tokio 运行时（tauri::async_runtime::set 的参数类型）
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tauri 把 x11 放在默认特性里，关了默认特性就要显式打开，否则 X11 会话里起不来
tauri = { version = "2.12", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
# 自定义标题栏（src/titlebar.rs，tauri-custom-titlebar skill 的原样文件）用到的 Win32 API。
# 版本与 tauri 2.12 依赖的 windows 一致（0.62），不多编一份。Win32_System_Registry 是本包
# 自己读「透明效果」开关用的（src/lib.rs 的 mica 模块）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 判定这台电脑有没有 Mica：Tauri 应用窗口效果时会丢掉 window-vibrancy 返回的错误，只有直接
# 调用它才拿得到结果。钉死成 tauri 2.12 依赖的那个版本：版本不同时 macOS 上会与 Tauri 带的
# 那份重复定义符号（tauri#15478），本包也只在 Windows 上用它。
window-vibrancy = "=0.8.1"
# 系统 build 号（经 RtlGetVersion，不受清单里兼容性声明的影响）。window-vibrancy 用它决定
# 走哪条 Mica 接口，本包按同一个数判定支持与否；它已经在依赖树里，不多出 crate。
windows-version = "0.1"

[build-dependencies]
tauri-build = "2.7"
