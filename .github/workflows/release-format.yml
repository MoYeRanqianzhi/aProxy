name: Release Format

# aproxy-format（官方示例 format 二进制）的**独立发布链**：format-v* tag 触发。
# 版本独立于 aproxy 的 alpha 线——它是示例程序，稳定后几乎不更新（更多功能
# 用户直接让 agent 写 format，见 aproxy-format skill）。
#
# 产物命名（与 aproxy 主程序同款 11 变体矩阵，互不混合）：
#   aproxy-format-<target>[-v3][.exe]  + .sha256 → GitHub Release（本 workflow）
#   npm @meowo/aproxy-format 主包 + 平台子包 → publish-format job
#   crates.io aproxy-envelope + aproxy-format（envelope 先发——format 依赖它）
#
# 下载后建议落 ~/.aproxy/bin/（config.toml 的 command 指向它）。

on:
  push:
    tags: ["format-v*"]

permissions:
  contents: write

concurrency:
  group: release-format-${{ github.ref }}
  cancel-in-progress: false # 发布绝不被并发取消

env:
  CARGO_TERM_COLOR: always

jobs:
  test-format:
    # 发布门槛：全 workspace 的 fmt/clippy/测试（format 与 aproxy 同仓同验，
    # 防止 format 发布带着 aproxy 的破损中间态）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build-format:
    needs: test-format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: .exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
    name: build-format (${{ matrix.target }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: format-${{ matrix.target }}${{ matrix.variant }}
      # 版本对齐：format-v0.1.0 → aproxy-format/Cargo.toml 与 Cargo.lock 的
      # aproxy-format 行改为 0.1.0（只动 format 成员，aproxy/envelope 不动——
      # 三成员版本线相互独立）
      - name: Align version with tag
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          assert tag.startswith('format-v'), f"format-v* 之外的 tag 不应触发本 workflow: {tag}"
          v = tag[len('format-v'):]
          assert v, "tag 版本为空"
          toml_path = 'aproxy-format/Cargo.toml'
          toml = open(toml_path, encoding='utf-8', newline='').read()
          toml, n1 = re.subn(r'(^version = )"[^"]*"', r'\g<1>"%s"' % v, toml, count=1, flags=re.M)
          assert n1 == 1, "aproxy-format/Cargo.toml 中未找到 version 行"
          open(toml_path, 'w', encoding='utf-8', newline='').write(toml)
          lock = open('Cargo.lock', encoding='utf-8', newline='').read()
          lock, n2 = re.subn(r'(name = "aproxy-format"\r?\nversion = )"[^"]*"', r'\g<1>"%s"' % v, lock)
          assert n2 == 1, "Cargo.lock 中未找到唯一的 aproxy-format 版本行"
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(lock)
          print("aproxy-format version ->", v)
          EOF
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        # -p aproxy-format：只构建示例二进制（workspace 内其余成员不进产物）
        run: cargo build --release --locked --target ${{ matrix.target }} -p aproxy-format
      - name: Stage asset
        shell: pwsh
        env:
          ASSET: aproxy-format-${{ matrix.target }}${{ matrix.variant }}${{ matrix.ext }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aproxy-format${{ matrix.ext }}" "dist/$env:ASSET"
          $hash = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -NoNewline -Encoding ascii "dist/$env:ASSET.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: format-bin-${{ matrix.target }}${{ matrix.variant }}
          path: dist

  release-format:
    needs: build-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release body
        run: |
          cd artifacts
          {
            echo "## aproxy-format（官方示例 format 程序）"
            echo ""
            echo "aProxy 外部转换器（\`request_transform\`/\`response_transform\`）的官方示例：协议转换（OpenAI ↔ Anthropic 等）、apikey 轮换/加权轮换、多模型多渠道聚合。用法见随 aProxy 分发的 aproxy-format skill。"
            echo ""
            echo "- **下载**：按平台选 \`aproxy-format-<target>[-v3]\`，建议落 \`~/.aproxy/bin/aproxy-format\`"
            echo "- **npm**：\`npm install -g @meowo/aproxy-format\`（含全平台预编译包，装后直接在 PATH）"
            echo "- **版本独立于 aProxy 主程序**：示例程序，稳定后几乎不更新（更多功能直接让 agent 写 format）"
            echo ""
            echo "## SHA256"
            echo ""
            echo "| 文件 | SHA256 |"
            echo "|---|---|"
            for f in *.sha256; do
              h=$(cut -d' ' -f1 "$f")
              a=$(cut -d' ' -f2- "$f" | sed 's/^ *//')
              echo "| \`$a\` | \`$h\` |"
            done
          } > ../release_body.md
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*
          body_path: release_body.md
          generate_release_notes: true

  publish-format:
    needs: release-format
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      # npm 组包从合并的 artifact 目录取平台二进制（ASSET_DIR=artifacts）——
      # 缺此步组包脚本找不到资产，format 渠道发布必然失败
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish npm packages（aproxy-format 主包 + 平台子包）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # 组名参数化：format = @meowo/aproxy-format 双包组
        run: bash npm/build-and-publish.sh format
      - uses: dtolnay/rust-toolchain@stable
      - name: Align version with tag (publish)
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          assert tag.startswith('format-v'), f"format-v* 之外的 tag 不应触发本 workflow: {tag}"
          v = tag[len('format-v'):]
          toml_path = 'aproxy-format/Cargo.toml'
          toml = open(toml_path, encoding='utf-8', newline='').read()
          toml, n1 = re.subn(r'(^version = )"[^"]*"', r'\g<1>"%s"' % v, toml, count=1, flags=re.M)
          assert n1 == 1, "aproxy-format/Cargo.toml 中未找到 version 行"
          open(toml_path, 'w', encoding='utf-8', newline='').write(toml)
          lock = open('Cargo.lock', encoding='utf-8', newline='').read()
          lock, n2 = re.subn(r'(name = "aproxy-format"\r?\nversion = )"[^"]*"', r'\g<1>"%s"' % v, lock)
          assert n2 == 1, "Cargo.lock 中未找到唯一的 aproxy-format 版本行"
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(lock)
          print("aproxy-format version ->", v)
          EOF
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: crates-auth
      - name: Publish to crates.io（envelope 先发——format 依赖它）
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty：工作区被上一步有意改为 tag 版本（对齐产物），非意外
        run: |
          cargo publish --locked --allow-dirty -p aproxy-envelope
          cargo publish --locked --allow-dirty -p aproxy-format
