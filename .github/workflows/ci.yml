name: CI

# 每次提交（push / PR）的全量测试与静态门槛。
# 发布门槛（fmt/clippy/test）在 release.yml 中独立复跑——tag 可能落后 main。

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消进行中的旧跑（省 runner 时间，最新结论才有意义）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    # 主开发平台：全量验证。零警告（-D warnings）是项目纪律。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      # --locked：Cargo.lock 是权威解析（windows-sys 精确钉死的历史教训——
      # 无锁重解析曾观察到直接依赖漂移到不兼容的新版本线）
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --verbose

  unix:
    # unix 分支已在 Ubuntu/WSL 实测全绿（2026-09-11，见团队记忆
    # install-three-platform-e2e）——CI 从编译面 check 升级为真实测试门槛，
    # 防止 unix-only 代码的编译/行为回归再次溜进 main。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked
