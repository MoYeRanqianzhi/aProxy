name: Release

# 主线（tag v*）的发布：前端构建 → 发布门槛（两种变体的全量验证）→ 20 个产物的构建矩阵 → skill
# 打包 → 发布清单（生成并核对）→ GitHub Release → npm 与 crates.io 两个渠道（publish-npm /
# publish-crates，trusted publishing / OIDC）。
#
# 产物（文件名不带版本号，版本由 tag 承载，见 install 计划「发布资产命名」）：
#   带桌面界面的 desktop  aproxy-<target>[-v3][.exe]           9 个（musl 没有带界面版）
#   无界面的 headless     aproxy-headless-<target>[-v3][.exe]  11 个
#   aproxy-manifest.json  发布清单（永久兼容契约 C6）：强制安装靠它找资产
#   aproxy-skills.zip + aproxy-skill-<名>.zip
#   每个二进制与 skill 包附 .sha256
# Release 说明由 .github/scripts/release-body.sh 生成（下载与更新链 + SHA256 表），变更记录由
# GitHub generate_release_notes 叠在后面。
#
# 可重跑：两个渠道 job 都先查询注册表、版本已存在才跳过，所以任一渠道失败后可以在 Actions 页面
# 对失败的 job 单独 re-run，已成功的渠道不会重复发布。
#
# 演练（workflow_dispatch，在任意分支上手动触发）：跑完同样的门槛、构建与清单核对，再对 npm 与
# crates.io 只做 --dry-run（rehearse-npm / rehearse-crates：不上传、不拿 OIDC 凭据、不进 release
# 环境），Release 只把资产清单与说明正文写进 job 摘要（rehearse-release），不建 Release、不打
# tag。没有「真发布」开关，发布只由 tag 触发。打 tag 之前用它确认流水线本身没问题：测试 tag 会在
# npm 与 crates.io 上永久占号（团队记忆 release-version-alignment）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "演练用的版本号（不带 v，如 0.2.0-alpha.1）；留空用 Cargo.toml 里的版本"
        required: false
        default: ""
        type: string

# 默认只读：门槛与构建会编译并运行全部依赖的 build.rs 与测试代码，不应持有可写 token。只有
# release job（写 GitHub Release）提升为 contents: write；两个渠道 job 只额外申请 OIDC 的 id-token。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布绝不被并发取消

env:
  CARGO_TERM_COLOR: always
  # headless 的 Linux gnu 产物能运行的最低 glibc。build 矩阵里 zigbuild: true 的条目按此版本链接
  # （cargo zigbuild --target <triple>.<下限>），构建后断言产物引用的 GLIBC_ 符号版本都不高于它。
  # 必须与 scripts/install.sh 和 npm/aproxy/bin/aproxy.js 中的 MIN_GLIBC 保持一致：两者在 glibc
  # 低于此值的系统上改装 musl 产物。若在 runner 上用系统 gcc 链接，产物会继承 runner 的 glibc
  # （ubuntu-24.04 为 2.39），Debian 12、Ubuntu 22.04 等系统会报 `GLIBC_2.39 not found` 而无法
  # 启动（alpha.17 实测如此）。
  GNU_GLIBC_FLOOR: "2.28"
  # 带界面的 Linux gnu 产物能运行的最低 glibc：它链接 ubuntu:22.04 容器里的 GTK 与 WebKitGTK，
  # 下限由构建系统决定（见 build-linux-desktop），构建后同样断言不高于它。必须与安装脚本、npm
  # 启动器判断「本机能不能跑带界面版」用的数一致（aproxy 自己的安装器不预先判断，只看下载下来的
  # 二进制能不能跑）。
  DESKTOP_GLIBC_FLOOR: "2.34"
  # 演练的版本号（tag 推送时为空、不用），.github/scripts/align-version.py 读它
  DRY_RUN_VERSION: ${{ inputs.version }}

jobs:
  frontend:
    # 桌面界面的前端只构建一次：带界面的门槛、构建与 crates.io 打包都用这一份产物
    # （aproxy-desktop 的 build.rs 在 aproxy-desktop/dist 缺失时报错，crate 包也要带着它）。
    # 发布流水线不用 npm 缓存，依赖每次按 package-lock.json 从 registry 取。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # npm run build 先跑 svelte-check（--fail-on-warnings），再由 Vite 输出到 aproxy-desktop/dist
      - name: Build the desktop front end
        working-directory: aproxy-desktop/ui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
          if-no-files-found: error

  test:
    # 发布门槛：与 CI 相同的全量验证（fmt/clippy/测试/--version 冒烟），windows 与 ubuntu、带界面
    # 与无界面四路都全绿才进入构建。--workspace 覆盖 aproxy-envelope 与 aproxy-format（理由见
    # Cargo.toml [workspace] 注释）；headless 再排除 aproxy-desktop（它是 workspace 成员，
    # --workspace 会把它当作选中的包编译，--no-default-features 管不到它）。macOS 已知红、支持未
    # 完成，不进门禁。
    needs: frontend
    name: test (${{ matrix.os }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false # 各路各自跑完，一次看到全部失败面
      matrix:
        os: [windows-latest, ubuntu-24.04]
        variant: [desktop, headless]
        include:
          - variant: desktop
            flags: ""
          - variant: headless
            flags: --exclude aproxy-desktop --no-default-features
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # 两种变体的编译产物不同，缓存分开存（rust-cache 的自动键不含 matrix 取值）
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.variant }}
      - uses: actions/download-artifact@v8.0.1
        if: matrix.variant == 'desktop'
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
      # 只装 webkit2gtk-4.1 的开发包（它带进 GTK3、libsoup3、JavaScriptCore 的开发包），理由见 ci.yml
      - name: Install WebKitGTK
        if: matrix.variant == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace ${{ matrix.flags }} --all-targets --locked -- -D warnings
      # 不带目标过滤的 cargo test 会顺带编译 examples——transform_integration
      # 依赖已编译的 examples/format-echo
      - run: cargo test --workspace ${{ matrix.flags }} --locked --no-fail-fast
      - name: Smoke-test --version (C5)
        shell: bash
        run: bash .github/scripts/version-smoke.sh target/debug/aproxy${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.variant }}

  build:
    # 在 runner 宿主机上构建的 17 个产物：Windows 与 macOS 的两个变体，Linux 的 headless（gnu 用
    # cargo-zigbuild 压低 glibc 下限，musl 静态链接，两者都只出 headless）。Linux gnu 的带界面版要在
    # 老系统里链接 WebKitGTK，另见 build-linux-desktop。
    #
    # x86-64-v3（AVX2，约 2013 年后主流 CPU）只给 x64 的 Windows 与 Linux gnu 出；install 按
    # is_x86_feature_detected 自动选档，失败回退 baseline。Windows x86（32 位）在 x64 runner 上
    # 交叉编译（MSVC 自带 x86 交叉工具链），Windows 与 Linux 的 ARM64 用原生 arm runner（ring 要
    # 编 C），macOS 在 Apple Silicon runner 上原生出 arm64、交叉出 x86_64。
    needs: test
    name: build (${{ matrix.target }}, ${{ matrix.ui }}${{ matrix.cpu == 'x86-64-v3' && ', x86-64-v3' || '' }})
    strategy:
      fail-fast: false # 单个产物失败不连坐其他产物
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ui: desktop, cpu: baseline, ext: .exe }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ui: desktop, cpu: x86-64-v3, ext: .exe }
          - { os: windows-latest, target: i686-pc-windows-msvc, ui: desktop, cpu: baseline, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, ui: desktop, cpu: baseline, ext: .exe }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ui: headless, cpu: baseline, ext: .exe }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ui: headless, cpu: x86-64-v3, ext: .exe }
          - { os: windows-latest, target: i686-pc-windows-msvc, ui: headless, cpu: baseline, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, ui: headless, cpu: baseline, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ui: desktop, cpu: baseline, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ui: desktop, cpu: baseline, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ui: headless, cpu: baseline, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ui: headless, cpu: baseline, ext: "" }
          # zigbuild: true：用 cargo-zigbuild 按 GNU_GLIBC_FLOOR 链接（见顶部 env）
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ui: headless, cpu: baseline, ext: "", zigbuild: true }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ui: headless, cpu: x86-64-v3, ext: "", zigbuild: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ui: headless, cpu: baseline, ext: "", zigbuild: true }
          # musl：静态链接，任何 Linux 都能跑（glibc 过老时的退路）；不出 x86-64-v3，收益低
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, ui: headless, cpu: baseline, ext: "", musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ui: headless, cpu: baseline, ext: "", musl: true }
    runs-on: ${{ matrix.os }}
    env:
      ASSET: aproxy-${{ matrix.ui == 'headless' && 'headless-' || '' }}${{ matrix.target }}${{ matrix.cpu == 'x86-64-v3' && '-v3' || '' }}${{ matrix.ext }}
      FEATURES: ${{ matrix.ui == 'headless' && '--no-default-features' || '' }}
      RUSTFLAGS: ${{ matrix.cpu == 'x86-64-v3' && '-C target-cpu=x86-64-v3' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # musl 目标的 ring（rustls-tls）要编 C 代码，需要 musl-gcc 工具链
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # zig 自带各 glibc 版本的符号桩，cargo-zigbuild 用它当链接器即可按指定 glibc 下限链接，不依赖
      # runner 自身的 glibc。headless 的依赖树里唯一的 C 代码是 ring（无 aws-lc/openssl），zig cc 可
      # 直接编译。两者都是 PyPI 上的预编译 wheel，版本钉死：升级时须重新实测产物（构建 + glibc 断言
      # + 低 glibc 系统试跑）。pip --target 装进临时目录：不碰 runner 的系统 Python 环境（Ubuntu
      # 24.04 的系统 Python 受 PEP 668 保护，--target 安装不受该限制）。
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/zigbuild" \
            cargo-zigbuild==0.23.4 ziglang==0.16.0
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$RUNNER_TEMP/zigbuild/ziglang/zig" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ env.ASSET }}
      - uses: actions/download-artifact@v8.0.1
        if: matrix.ui == 'desktop'
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
      - name: Align version with the release
        shell: bash
        run: python3 .github/scripts/align-version.py
      - name: Build
        if: ${{ !matrix.zigbuild }}
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} $FEATURES
      # <triple>.<glibc> 是 cargo-zigbuild 的目标写法：传给 cargo 的仍是 <triple>，产物照常落在
      # target/<triple>/release/，后面的步骤不用区分两种构建
      - name: Build (cargo-zigbuild, glibc floor)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}.${GNU_GLIBC_FLOOR}" $FEATURES
      - name: Assert glibc floor
        if: matrix.zigbuild
        run: bash .github/scripts/assert-glibc-floor.sh target/${{ matrix.target }}/release/aproxy "$GNU_GLIBC_FLOOR"
      - name: Stage asset
        shell: bash
        run: python3 .github/scripts/stage-asset.py target/${{ matrix.target }}/release/aproxy${{ matrix.ext }} dist "$ASSET"
      - name: Smoke-test --version (C5)
        shell: bash
        run: bash .github/scripts/version-smoke.sh "dist/$ASSET" ${{ matrix.ui }} ${{ matrix.target }} ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-${{ env.ASSET }}
          path: dist
          if-no-files-found: error

  build-linux-desktop:
    # Linux gnu 的带界面版（3 个产物）：动态链接 GTK 与 WebKitGTK，glibc 下限由链接到的系统库决定，
    # 不能像 headless 那样用 cargo-zigbuild 压低。于是在想支持的最老基线系统里构建（Tauri 文档的
    # 建议）：container: ubuntu:22.04 跑在 ubuntu-24.04 与 24.04-arm 上（ubuntu-22.04 runner
    # 2026-09-17 起弃用、2027-04-17 退役）。产物要求 glibc ≥ DESKTOP_GLIBC_FLOOR、WebKitGTK ≥ 2.40
    # （tauri 打开了 webkit2gtk 的 v2_40 特性）；冒烟在容器里真的执行 --version，确认 22.04 上的
    # 动态加载器装得上它。
    needs: test
    name: build (${{ matrix.target }}, desktop${{ matrix.cpu == 'x86-64-v3' && ', x86-64-v3' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, cpu: baseline }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, cpu: x86-64-v3 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, cpu: baseline }
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    env:
      ASSET: aproxy-${{ matrix.target }}${{ matrix.cpu == 'x86-64-v3' && '-v3' || '' }}
      RUSTFLAGS: ${{ matrix.cpu == 'x86-64-v3' && '-C target-cpu=x86-64-v3' || '' }}
    steps:
      # 容器是精简镜像，缺的都在这里装：git（有它 checkout 才是真正的仓库，而不是 REST API 下载的
      # 源码包）、curl 与 ca-certificates（rustup 安装）、build-essential（cc、ld、objdump）、
      # pkg-config 与 WebKitGTK 的开发包（链接用，同时带进运行库，冒烟能真的执行）、python3（版本
      # 对齐与暂存脚本）
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 libwebkit2gtk-4.1-dev
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ env.ASSET }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
      - name: Align version with the release
        shell: bash
        run: python3 .github/scripts/align-version.py
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Assert glibc floor
        shell: bash
        run: bash .github/scripts/assert-glibc-floor.sh target/${{ matrix.target }}/release/aproxy "$DESKTOP_GLIBC_FLOOR"
      - name: Stage asset
        shell: bash
        run: python3 .github/scripts/stage-asset.py target/${{ matrix.target }}/release/aproxy dist "$ASSET"
      - name: Smoke-test --version (C5)
        shell: bash
        run: bash .github/scripts/version-smoke.sh "dist/$ASSET" desktop ${{ matrix.target }} ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-${{ env.ASSET }}
          path: dist
          if-no-files-found: error

  skills:
    # skill 文档打包：总包（解压得 ~/.aproxy/skills/ 内容）+ 每个 skill 单包。
    # 泛化遍历 .claude/skills/*/：新增 skill 目录零改动自动进总包与单包。
    # 单包顶层目录 = skill 名，解压到 ~/.aproxy/skills/ 即落位。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Package skills
        run: |
          mkdir -p stage
          cp -r .claude/skills/* stage/
          (cd stage && zip -qr ../aproxy-skills.zip */)
          sha256sum aproxy-skills.zip > aproxy-skills.zip.sha256
          for d in .claude/skills/*/; do
            name=$(basename "$d")
            (cd .claude/skills && zip -qr "../../aproxy-skill-${name}.zip" "$name")
            sha256sum "aproxy-skill-${name}.zip" > "aproxy-skill-${name}.zip.sha256"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-skills
          path: |
            aproxy-skills.zip
            aproxy-skills.zip.sha256
            aproxy-skill-*.zip
            aproxy-skill-*.zip.sha256

  manifest:
    # 发布清单（永久兼容契约 C6）：从 20 个二进制生成 aproxy-manifest.json，并用强制安装读清单的
    # 同一段代码读回核对，做法见 examples/release-manifest.rs 的模块文档。要编译并运行仓库代码，
    # 所以与写仓库的 release job 分开，只有只读权限。--no-default-features：清单代码在 lib 里，
    # 用不着编译桌面界面。
    needs: [build, build-linux-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: artifacts
          merge-multiple: true
      - name: Align version with the release
        run: python3 .github/scripts/align-version.py
      - name: Generate and verify aproxy-manifest.json
        run: cargo run --locked --no-default-features --example release-manifest -- "$RELEASE_VERSION" artifacts aproxy-manifest.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifest
          path: aproxy-manifest.json
          if-no-files-found: error

  release:
    # 全 workflow 唯一需要写仓库的 job：创建 Release 并上传资产。只运行仓库里的 release-body.sh，
    # 不编译、不执行任何依赖代码。演练时跳过（它的依赖者 publish-npm、publish-crates 随之跳过）。
    if: github.event_name == 'push'
    needs: [manifest, skills]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Assemble release body
        run: bash .github/scripts/release-body.sh artifacts "$GITHUB_REF_NAME" > release_body.md
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*
          body_path: release_body.md
          generate_release_notes: true
          # 预发布判定：tag 含 -alpha/-beta/-rc 即预发布，否则为稳定版。
          # npm/build-and-publish.sh 的 npm_dist_tag() 是同一条规则（预发布发
          # npm 的 next，稳定版发 latest），改动任一处必须同步另一处。
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          # make_latest 有意不写，交给 GitHub API 默认值：新发布的非预发布
          # Release 自动成为 Latest（format-v0.1.0 就是这样成为 Latest 的），
          # 预发布永远不会成为 Latest。不写死 true 的原因：re-run 某个旧 tag 的
          # release job 时，action 会带着 make_latest 更新已有 Release，写死 true
          # 会把 Latest 从更新的稳定版抢回旧版；不传则不改动现有标记。
          # format 线（release-format.yml）显式写 false，不参与 Latest。

  rehearse-release:
    # 演练：把 Release 会带的资产与说明正文写进 job 摘要，不建 Release
    if: github.event_name == 'workflow_dispatch'
    needs: [manifest, skills]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Show what the release would carry
        run: |
          version=$(python3 -c 'import json; print(json.load(open("artifacts/aproxy-manifest.json"))["version"])')
          {
            echo "# 演练：v$version 的 Release 会带这些资产"
            echo ""
            echo '```'
            ls -l artifacts
            echo '```'
            echo ""
            bash .github/scripts/release-body.sh artifacts "v$version"
          } >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/aproxy-manifest.json

  publish-npm:
    # npm 渠道：GitHub Release 成功落位后才发。认证走 trusted publishing：setup-node + id-token，
    # npm publish 自动走 OIDC。两组包：带界面的 @meowo/aproxy 与无界面的 @meowo/aproxy-headless，
    # 各一个主包加 9 个平台子包，20 个包都要在 npmjs.com 绑定 Trusted Publisher（workflow
    # release.yml、environment release），缺绑定的包发布时返回 404。
    # build-and-publish.sh 逐包先查询版本是否已存在，已存在则跳过，所以失败后可以单独 re-run 本 job。
    needs: release
    runs-on: ubuntu-latest
    # environment 名须与 npm/crates.io 网站侧 Trusted Publisher 配置一致
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: artifacts
          merge-multiple: true
      # npm 要求 Node ≥22.14 / npm CLI ≥11.5.1（trusted publishing 门槛）
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish npm packages (desktop group, then headless group)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bash npm/build-and-publish.sh
          bash npm/build-and-publish.sh headless

  rehearse-npm:
    # 演练：两组 npm 包照常组包，npm publish 只带 --dry-run（不上传）。没有 id-token 权限、不进
    # release 环境，拿不到任何发布凭据。
    if: github.event_name == 'workflow_dispatch'
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Align version with the release
        run: python3 .github/scripts/align-version.py
      - name: Pack npm packages (dry run)
        run: |
          bash npm/build-and-publish.sh --dry-run
          bash npm/build-and-publish.sh headless --dry-run

  publish-crates:
    # crates.io 渠道：与 publish-npm 并行、互不依赖，可以单独 re-run。
    # 认证：rust-lang/crates-io-auth-action 用 OIDC 换短期 token；表达式 ||
    # 兜底到仓库 secret CARGO_REGISTRY_TOKEN（OIDC 未配置时 action 输出为空）。
    # 新 crate 的首个版本 OIDC 不能发，必须由所有者本地手动首发（aproxy-desktop 也是这样）。
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # aproxy-desktop 的包要带构建好的前端；校验构建会编译它（Linux 上链接 WebKitGTK），
      # 也会以默认的 desktop 特性编译 aproxy
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      # 本 job 是独立 checkout：crates.io 按 .crate 内 manifest 登记版本，不对齐会让测试 tag 抢注
      # 正式版号（alpha.10/alpha.11 就这么被占掉的）
      - name: Align version with the release
        run: python3 .github/scripts/align-version.py
      # 按依赖顺序：aproxy 依赖 aproxy-envelope 与 aproxy-desktop 的 registry 版本
      - name: Plan crates to publish
        id: plan
        run: bash .github/scripts/plan-crates.sh aproxy-envelope aproxy-desktop aproxy
      # tauri-build 往包根写 gen/schemas/，包里要带着本平台的那几个文件，校验构建才不会被判为
      # 「改动了源码目录」（见 aproxy-desktop/Cargo.toml 的 include 说明）。这次构建的依赖产物
      # 校验构建接着用
      - name: Generate the ACL schemas of aproxy-desktop
        if: contains(steps.plan.outputs.args, 'aproxy-desktop')
        run: cargo build -p aproxy-desktop --locked
      # 多个 -p 时 cargo（1.90+）按依赖顺序打包，并用本地刚打好的包校验后续包，所以
      # envelope、desktop 的新版本尚未上 crates.io 时，aproxy 的 dry-run 也能通过。
      # --allow-dirty：工作区被对齐步骤有意改为 tag 版本，非意外。
      - name: Dry run
        if: steps.plan.outputs.args != ''
        run: cargo publish --dry-run --locked --allow-dirty ${{ steps.plan.outputs.args }}
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        if: steps.plan.outputs.args != ''
        id: crates-auth
      - name: Publish to crates.io
        if: steps.plan.outputs.args != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty ${{ steps.plan.outputs.args }}

  rehearse-crates:
    # 演练：与 publish-crates 相同的打包与校验构建，只跑 cargo publish --dry-run（不上传）。没有
    # id-token 权限、不进 release 环境，拿不到任何发布凭据。
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: aproxy-desktop/dist
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - name: Align version with the release
        run: python3 .github/scripts/align-version.py
      - name: Plan crates to publish
        id: plan
        run: bash .github/scripts/plan-crates.sh aproxy-envelope aproxy-desktop aproxy
      - name: Generate the ACL schemas of aproxy-desktop
        if: contains(steps.plan.outputs.args, 'aproxy-desktop')
        run: cargo build -p aproxy-desktop --locked
      - name: Dry run
        if: steps.plan.outputs.args != ''
        run: cargo publish --dry-run --locked --allow-dirty ${{ steps.plan.outputs.args }}
