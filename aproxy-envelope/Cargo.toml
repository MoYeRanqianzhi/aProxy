[package]
name = "aproxy-envelope"
version = "0.2.0-alpha.1"
# 信封契约 crate：与 aproxy 同库开发。aproxy 0.2.0 正式版之前，它随主线与 aproxy、
# aproxy-desktop 同号发预发布版（0.2.0-alpha.N 等），发布前由 .github/scripts/align-version.py
# 一起对齐；到 aproxy 0.2.0 正式版时才发 0.2.0（W2 设计稿 §10.13）。正式版号一经发布就永久
# 占用，而 0.2.0 定稿之前信封还要改（加 #[non_exhaustive]、改类型），所以预发布期间不能用它。
edition = "2024"
rust-version = "1.88"
description = "Transform envelope contract shared by aproxy and aproxy-format"
license = "MIT"
authors = ["aProxy Contributors"]
repository = "https://github.com/MoYeRanqianzhi/aProxy"
keywords = ["aproxy", "envelope", "transform"]
categories = ["network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# body_b64 的编码/解码（标准字母表无换行）；与 switchyard-translation 的
# base64 同版本线，workspace lockfile 收敛为一份
base64 = "0.23"
