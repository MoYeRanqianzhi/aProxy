# 三个平台的桌面窗口截图：各自编出带界面的变体，在临时 home 里用 .github/screenshots/scene.py 摆好场景
# （两个实例、一批经模拟上游的请求、预设界面语言与深浅色），截全屏并裁出窗口，作为 artifact 上传。
# 目前只在 probe/screenshots 分支上跑，用来预览；定稿后改成手动触发并自动开 PR 替换 README 的截图。
name: Screenshots

on:
  push:
    branches: [probe/screenshots]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 11 的外观（圆角、Win11 的标题栏按钮、Mica）只有客户端系统有；windows-latest 是 Server 2025，
          # 窗口是 Windows 10 的样子。公开仓库可以用 Arm64 的 Windows 11 托管 runner
          - { os: windows-11-arm, name: windows, exe: target/debug/aproxy.exe }
          - { os: macos-latest, name: macos, exe: target/debug/aproxy }
          - { os: ubuntu-24.04, name: linux, exe: target/debug/aproxy }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # 场景名与 aproxy-desktop/ui/src/lib/backend/demo/scenes.ts 的表一一对应；每个场景截英文浅色、英文深色、中文浅色
      SCENES: overview overview-lower instance instance-restore logs log-detail log-request log-response log-format config update settings settings-packages pulse palette start-menu empty
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aproxy-desktop/ui/package-lock.json
      - name: Linux desktop dependencies and a virtual display
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev xvfb openbox xdotool x11-utils imagemagick fonts-noto-cjk dbus-x11
      - name: Build the desktop front end
        working-directory: aproxy-desktop/ui
        run: |
          npm ci
          npm run build
      - name: Windows screen resolution
        if: matrix.name == 'windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/screenshots/resolution.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/screenshots/clear-desktop.ps1
      # macOS runner 的显示器默认 1024×768，窗口按 1200×780 打开会被压到屏幕里（截出来只有 922×607）。
      # 用 displayplacer 换成模式表里 1920×1080 的那一档（runner 上没有 HiDPI 模式，仍是 1 倍）
      - name: macOS screen resolution
        if: matrix.name == 'macos'
        run: |
          brew install displayplacer
          displayplacer list
          id=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          mode=$(displayplacer list | grep -m1 'res:1920x1080' | sed -E 's/^ *mode ([0-9]+):.*//')
          displayplacer "id:$id mode:$mode"
          sleep 2
          displayplacer list | grep -i 'resolution:'
      - run: cargo build --locked --bins
      - run: python -m pip install --quiet pillow
      - name: Shoot (Windows, macOS)
        if: matrix.name != 'linux'
        shell: bash
        run: |
          # 首次登录体验的向导可能在构建期间又弹出来：开拍前再清一次
          if [ "${{ matrix.name }}" = windows ]; then powershell -NoProfile -ExecutionPolicy Bypass -File .github/screenshots/clear-desktop.ps1; fi
          for scene in $SCENES; do
            for v in "en light" "en dark" "zh-CN light"; do
              set -- $v
              python .github/screenshots/scene.py "${{ matrix.exe }}" "shots/${{ matrix.name }}/$scene-$1-$2" "$1" "$2" "$scene" || true
            done
          done
      - name: Shoot (Linux)
        if: matrix.name == 'linux'
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          export DISPLAY=:99
          openbox &
          sleep 1
          for scene in $SCENES; do
            for v in "en light" "en dark" "zh-CN light"; do
              set -- $v
              dbus-run-session -- python .github/screenshots/scene.py "${{ matrix.exe }}" "shots/${{ matrix.name }}/$scene-$1-$2" "$1" "$2" "$scene" || true
            done
          done
      # Linux 的标题栏是页面画的（没有窗口管理器的装饰）：用 xdotool 实际拖动、双击、点按钮、改大小，读回结果
      - name: Check the Linux title bar
        if: matrix.name == 'linux'
        run: |
          export DISPLAY=:99
          dbus-run-session -- python .github/screenshots/linux-titlebar.py "${{ matrix.exe }}" shots/linux-titlebar
      # 图集只要裁好的窗口图，按「场景-语言-深浅色.png」平铺；全屏截图与日志另放一份，排查时用
      - name: Collect the gallery
        if: always()
        shell: bash
        run: |
          mkdir -p gallery/${{ matrix.name }}
          for d in shots/${{ matrix.name }}/*/; do
            [ -f "$d/window.png" ] && cp "$d/window.png" "gallery/${{ matrix.name }}/$(basename "$d").png"
          done
          ls gallery/${{ matrix.name }} | wc -l
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gallery-${{ matrix.name }}
          path: gallery/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: shots-${{ matrix.name }}
          path: shots/
          retention-days: 7
