name: Release

# tag 推送触发：全量测试门槛 → 多平台构建矩阵 → skill 打包 → GitHub Release
# → npm + crates.io 渠道发布（trusted publishing / OIDC，见 publish job）。
# 产物命名（文件名不带版本号，版本由 tag 承载，见 install 计划「发布资产命名」）：
#   aproxy-<target>[-v3][.exe]  +  aproxy-skills.zip  +  aproxy-skill-<名>.zip
#   每个资产附 .sha256
# Release 说明自动包含「下载与更新链」说明 + SHA256 清单，
# 变更记录由 GitHub generate_release_notes 生成，叠在自定义正文之后。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布绝不被并发取消

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # 发布门槛：与 CI 相同的全量验证（fmt/clippy/测试），全绿才进入构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false # 单平台失败不连坐其他平台的产物
      matrix:
        include:
          # Windows 主平台 x64：baseline + x86-64-v3（AVX2，约 2013 年后主流
          # CPU；install 按 is_x86_feature_detected 自动选变体，失败回退 baseline）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: .exe
          # Windows x86（32 位）与 ARM64：x64 runner 交叉编 x86（MSVC 自带
          # x86 交叉工具链）；ARM64 用原生 arm runner（ring 要编 C）
          - os: windows-latest
            target: i686-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          # Linux x64：gnu（常规发行版）双变体 + musl（静态链接，无 glibc 环境
          # 可用；musl 不出 v3——变体组合收益低）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          # Linux ARM64：Graviton/Ampere 服务器 + M 系列 Mac 的 Docker arm64
          # 容器（刚需场景）；gnu + musl 双库，原生 arm runner
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          # macOS：Apple Silicon 原生 + Intel 交叉编译（arm runner 可交叉出 x86_64）
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
    name: build (${{ matrix.target }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # musl 目标的 ring（rustls-tls）要编 C 代码，需要 musl-gcc 工具链
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # RUSTFLAGS 参与 rust-cache 的缓存键——变体间缓存互不污染
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}${{ matrix.variant }}
      # 版本对齐（测试 tag 与正式 tag 同样生效）：产物自报版本必须等于
      # tag 版本——staged 自证（install 的 --version 校验）、npm 包 version、
      # crates.io 注册版本全部以此为准。缺失此步时 tag v…t1 发布的产物
      # 仍是 Cargo.toml 里的旧版本号，install 特定版本的全渠道自证全炸
      # （实测暴露），且 crates.io 会按旧版本号注册、污染正式版号。
      - name: Align version with tag
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          v = os.environ.get('GITHUB_REF_NAME', '')[1:]
          assert v, "GITHUB_REF_NAME 为空（非 tag 触发？）"
          # encoding 显式 utf-8（Windows runner 默认 cp1252 解码会崩）；
          # \r?\n 兼容 CRLF 行尾；不用 sed（BSD/GNU 的 -i 语法分裂）
          toml = open('Cargo.toml', encoding='utf-8', newline='').read()
          toml, n1 = re.subn(r'(^version = )"[^"]*"', r'\g<1>"%s"' % v, toml, count=1, flags=re.M)
          assert n1 == 1, "Cargo.toml 中未找到 [package] version 行"
          open('Cargo.toml', 'w', encoding='utf-8', newline='').write(toml)
          lock = open('Cargo.lock', encoding='utf-8', newline='').read()
          lock, n2 = re.subn(r'(name = "aproxy"\r?\nversion = )"[^"]*"', r'\g<1>"%s"' % v, lock)
          assert n2 == 1, "Cargo.lock 中未找到唯一的 aproxy 版本行"
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(lock)
          print("version ->", v)
          EOF
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: pwsh
        env:
          ASSET: aproxy-${{ matrix.target }}${{ matrix.variant }}${{ matrix.ext }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aproxy${{ matrix.ext }}" "dist/$env:ASSET"
          $hash = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -NoNewline -Encoding ascii "dist/$env:ASSET.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bin-${{ matrix.target }}${{ matrix.variant }}
          path: dist

  skills:
    # skill 文档打包：总包（解压得 ~/.aproxy/skills/ 内容）+ 每个 skill 单包
    # （当前仅 aproxy-cli 一个，内容相同；未来多 skill 时单包只含各自的）。
    # 顶层目录统一为 aproxy-cli/，解压到 ~/.aproxy/skills/ 即落位。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package skills
        run: |
          mkdir -p stage
          cp -r .claude/skills/aproxy-cli stage/
          cd stage
          zip -r ../aproxy-skills.zip aproxy-cli
          cp ../aproxy-skills.zip ../aproxy-skill-aproxy-cli.zip
          cd ..
          for f in aproxy-skills.zip aproxy-skill-aproxy-cli.zip; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: skills
          path: |
            aproxy-skills.zip
            aproxy-skills.zip.sha256
            aproxy-skill-aproxy-cli.zip
            aproxy-skill-aproxy-cli.zip.sha256

  release:
    needs: [build, skills]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release body（更新链 + 基础信息 + SHA256 清单）
        run: |
          cd artifacts
          {
            echo "## 下载与更新链"
            echo ""
            echo "\`aproxy install\` 自动按默认链条尝试：**github → npm → cargo-binstall → cargo**。"
            echo ""
            echo "- **GitHub（本页 assets）**：按平台选择 \`aproxy-<target>[-v3]\`；\`-v3\` 需要 AVX2（约 2013 年后的主流 x86_64 CPU），不确定就选无后缀的 baseline 版本"
            echo "- **npm**：\`npm install -g @meowo/aproxy\`（含全平台预编译包）"
            echo "- **cargo-binstall**：\`cargo binstall aproxy\`（预编译，免编译）"
            echo "- **cargo（源码编译）**：\`cargo install aproxy --root ~/.aproxy\`"
            echo ""
            echo "- **skill 文档**：\`aproxy-skills.zip\`（总包）/\`aproxy-skill-aproxy-cli.zip\`（单包）——install 自动随版本更新 skill，通常无需手动下载"
            echo ""
            echo "安装/升级推荐直接用 install 指令：\`aproxy install\`（自动选变体并滚动重启实例）。"
            echo ""
            echo "## 基础信息"
            echo ""
            echo "- 版本：\`${GITHUB_REF_NAME}\`"
            echo "- 平台产物：windows（x64/x86/arm64）/ linux（x64+arm64，gnu+musl）/ macOS（arm64+x64），x86_64 提供 baseline 与 AVX2（-v3）两种指令集变体"
            echo "- 变更记录：见下方 Automatic release notes"
            echo ""
            echo "## SHA256"
            echo ""
            echo "| 文件 | SHA256 |"
            echo "|---|---|"
            for f in *.sha256; do
              h=$(cut -d' ' -f1 "$f")
              a=$(cut -d' ' -f2- "$f" | sed 's/^ *//')
              echo "| \`$a\` | \`$h\` |"
            done
          } > ../release_body.md
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*
          body_path: release_body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  publish:
    # npm + crates.io 渠道发布：GitHub Release 成功落位后才发渠道。
    # 认证走 trusted publishing（OIDC 免长期 token）：crates.io 侧用
    # rust-lang/crates-io-auth-action 换短期 token；npm 侧 setup-node +
    # id-token 由 npm publish 自动走 OIDC（npmjs.com 绑定 Trusted Publisher
    # 后生效）。绑定前的首发期回退仓库 secrets（CARGO_REGISTRY_TOKEN /
    # NPM_TOKEN），表达式 || 兜底：OIDC 未配置时 action 输出为空，落回 secrets。
    needs: release
    runs-on: ubuntu-latest
    # environment 名须与 npm/crates.io 网站侧 Trusted Publisher 配置一致
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # npm 要求 Node ≥22.14 / npm CLI ≥11.5.1（trusted publishing 门槛）
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish npm packages（主包 + 5 平台子包）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash npm/build-and-publish.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: crates-auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
