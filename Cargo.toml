[package]
name = "aproxy"
version = "0.1.0-alpha.16"
# edition 2024 本身要 1.85，实际下限由依赖树抬高到 1.88：src/decode.rs 引入的
# ruzstd 要 1.87，url→idna→idna_adapter 拖进来的 icu_* 一族要 1.88（这些 crate
# 在依赖图里是实打实被编译的，非可选）。声明出来，旧工具链会得到一条明确的
# 「rustc 1.88 或更新」报错，而不是一堆看不懂的编译失败。
rust-version = "1.88"
edition = "2024"
description = "Local API proxy with infinite retries for agent workloads"
license = "MIT"
authors = ["aProxy Contributors"]
repository = "https://github.com/MoYeRanqianzhi/aProxy"
keywords = ["proxy", "retry", "api", "agent", "claude-code"]
categories = ["network-programming", "web-programming"]
# crates.io 白名单：crate 只装代码与文档，仓库其余（bench/文档树/工作流）不进包。
# 前导 / 锚定仓库根——不带 / 的模式（如 README.md）会按 gitignore 语义匹配
# 任意层级（实测 npm/ 子目录的 README 混进过包）
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/.claude/skills/aproxy-cli/**"]

[[bin]]
name = "aproxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
http-body-util = "0.1"
futures-util = "0.3"
http = "1"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# install 下载校验：github 渠道 .sha256 强校验 / npm integrity 换算 / --from 完整性记录
sha2 = "0.11"
# install 下载链条：npm/cargo 渠道的 tgz/.crate 解包 + 版本比较（降级防呆）
tar = "0.4"
flate2 = "1"
semver = "1"
# skill 更新支线：GitHub skills 资产的 zip 解包
zip = { version = "2", default-features = false, features = ["deflate"] }
# 受限重试路径（config.toml bounded_retry_paths）：用户配置的正则模式，
# 命中的请求失败达尝试上限即透传。纯正则引擎，无 C 依赖，musl/aarch64
# 交叉编译与 CI 不受影响。
regex = "1"
# 响应体检查用解码器（src/decode.rs）：把压缩响应解出一份副本供「错误判定 +
# 日志预览」使用——转发给客户端的字节始终是上游原样，本模块不参与转发路径。
# 两者均为**纯 Rust**实现（无 C 依赖，故 musl/aarch64 交叉编译与 CI 各平台不受
# 影响）；gzip/deflate 复用上面的 flate2，不重复引依赖。
#
# br 直接依赖解码器 crate 而非门面包 brotli：门面包把**编码器**和**解码器**编在
# 同一个库里，没有只留解码器的特性（它的 default = ["std"] 同时控制两者的 std
# 接口，关掉 default 会让 Decompressor 与 CompressorWriter 一起消失），生产路径
# 却只用 Decompressor。故常规依赖取纯解码器，编码器只在单测里造样本，放
# dev-dependencies——二进制不再编译编码器那一半。两者版本有约束关系：brotli
# 9.0.0 依赖 `brotli-decompressor ~6.0`，升 brotli 时需核对本行。
brotli-decompressor = "6.0.0"
ruzstd = "0.9.0"

[target.'cfg(windows)'.dependencies]
# spawn_detached 手写 CreateProcessW（bInheritHandles=FALSE，std 无稳定 API 可关）。
# 精确钉死 =0.52.0：HANDLE 在 windows-sys 0.59+ 从 isize 改为 *mut c_void，
# 本仓库句柄逻辑（看门狗/force_terminate）全部按 isize 书写；CI 首跑曾观察到
# ^0.52 被解析为 0.61.2（本地同款 lock 解析 0.52.0 正常，机制未定位），
# 精确钉死 + CI --locked 双保险根除解析漂移。
# Win32_System_Memory：看门狗共享内存心跳节（CreateFileMappingW/MapViewOfFile）。
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# 仅测试用：造 brotli 压缩样本需要编码器（CompressorWriter），生产路径不需要。
# 放在这里既让 `cargo test` 拿得到，又让常规/release 构建完全不编译编码器。
brotli = "9.0.0"

# release 优化：代理是网络 IO 密集型（转发时间花在等上游/等客户端，CPU 占比
# 极低），speed 与 size 基本不冲突，可兼得：
# - lto="fat" + codegen-units=1：跨 crate 全量优化，热路径内联与死代码消除
#   最大化（speed+size 双收益），代价是编译时间显著变长——release 构建不
#   频繁，可接受
# - opt-level="z"：对 IO 密集负载的吞吐无可测影响，二进制却显著更小
# - panic 保持默认 unwind（不设 panic="abort"）：axum/hyper 每连接是独立
#   tokio 任务，handler panic 时 unwind 只断该连接、实例继续服务；abort 会
#   让任何一处 bug 杀掉整个实例——对「无限重试不间断」的使命与依赖本代理
#   的 agent 会话是严重回退。实测 abort 可再省 32% 体积（4.06→2.77MB），
#   但那是磁盘占用不是运行性能；若未来采用 abort，必须配套看门狗自动重启，
#   且重启窗口期全连接断流仍劣于连接级隔离
# - strip=true：符号/调试信息不参与运行（排查 backtrace 用 dev 构建复现）
# - target-cpu 不设：构建产物会分发到不同机器，native 指令集会在他机直接
#   非法指令崩溃
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
