[package]
name = "aproxy-format"
version = "0.1.0"
# 官方示例 format 二进制：协议转换（switchyard-translation）+ apikey 轮询/
# 加权轮询 + 多模型多渠道聚合。版本独立于 aproxy 的 alpha 线——它稳定后
# 几乎不更新（只是示例，别的功能用户直接让 agent 配置），单独发 Release
# （独立 tag 触发 release-format workflow）。
edition = "2024"
# 依赖树实际下限：switchyard 0.3 要求 rustc 1.96.1（声明须真实，1.88 会
# 误导旧工具链用户撞上看不懂的依赖编译错误）
rust-version = "1.96.1"
description = "Official example format program for aproxy: protocol conversion, key rotation, and multi-channel aggregation"
license = "MIT"
authors = ["aProxy Contributors"]
repository = "https://github.com/MoYeRanqianzhi/aProxy"
keywords = ["aproxy", "format", "llm", "proxy"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# 协议转换：Pure Rust sans-I/O 的 request/response/stream 翻译
# （OpenAiChat / AnthropicMessages / OpenAiResponses 三 wire format）
switchyard-translation = "0.3"
# 信封契约：与 aproxy 二进制共同类型单源维护。version + path 双写——
# 纯 path 依赖会被 cargo publish 硬性拒绝（crates.io 发布链必需 version）
aproxy-envelope = { version = "0.1.0", path = "../aproxy-envelope" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.23"
# 渠道表 models 的 glob 模式匹配
glob = "0.3"
tracing = "0.1"

[dev-dependencies]
# 端到端测试的临时配置目录
tempfile = "3"

# [profile.release] 不在此声明：profile 属于 workspace root（根 Cargo.toml
# 的 [profile.release] 对全 workspace 生效，取舍理由见那里的注释）
