# cargo-deny 配置（review 工作流的静态审查矩阵）
# 三维审查：advisories（RUSTSEC 安全通告）/ licenses（合规）/ sources（依赖源可信）
# 每次提交与每周定时（RUSTSEC 数据库更新后）都会跑。

# 依赖源审查：只允许 crates.io registry 依赖，禁止混入 git/路径外源——
# 防止依赖被替换为不可信源（供应链攻击面收口）。
[sources]
unknown-registry = "deny"
unknown-git = "deny"

# 安全通告：有 RUSTSEC 漏洞即红灯（安装器/代理面向公网依赖，安全优先）
[advisories]
version = 2
yanked = "deny"
# 豁免只按编号逐条写、附理由；依赖升级后不再命中的条目随即删掉。
# 下面两条都来自桌面界面（aproxy-desktop → tauri）在 Linux/BSD 上的 GTK3 一族：webkit2gtk 4.1
# 的绑定固定在 gtk-rs 0.18，没有带修复的 0.18.x，要等 Tauri 换到 GTK4 才会消失。它们只进
# Linux/BSD 的带界面构建，headless 与 Windows 构建都不含；cargo-deny 默认按全部目标平台检查，
# 所以照样命中。
ignore = [
    # glib 0.18 的 VariantStrIter 迭代器不健全（0.20 修复）。它只经 Variant::array_iter_str() 得到，
    # 依赖 glib 0.18 的 crate（tauri、tao、wry、muda、webkit2gtk 与 gtk-rs 各绑定）都没有调用（2026-10-12 检索源码）
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 from Tauri's GTK3 stack (Linux desktop build only); no crate in the tree uses VariantStrIter" },
    # proc-macro-error 不再维护：它是 glib-macros 0.18 的过程宏依赖，只在编译期运行，不进二进制
    { id = "RUSTSEC-2024-0370", reason = "proc-macro dependency of glib-macros 0.18 from Tauri's GTK3 stack; compile-time only" },
]

# 许可证合规：项目 MIT，依赖白名单为开源常见宽松许可集合。
# ring 0.17（rustls-tls 依赖）的 SPDX 为 "ISC AND MIT AND OpenSSL"，
# OpenSSL 派生代码条款在此随 ISC/MIT 一并允许。
# 首次运行若爆出未收录许可，按实际依赖补充 allow 而不是放宽机制。
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
]
