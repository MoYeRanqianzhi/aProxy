version: 2
updates:
  # CI 使用的 actions 版本自动跟进（本仓库铁则：actions 用最新发布版本）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # 依赖升级 PR 会跑完整 CI（fmt/clippy/test + cargo-deny），升级质量有门槛
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # windows-sys 精确钉死 =0.52.0：HANDLE 类型为 isize，0.59+ 改为
      # *mut c_void（本仓库句柄逻辑全部按 isize 书写，Cargo.toml 有注释）。
      # 忽略它的所有升级建议，避免周期性无效 PR。
      - dependency-name: "windows-sys"
        versions: [">=0.53"]
