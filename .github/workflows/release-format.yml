name: Release Format

# aproxy-format（官方示例 format 二进制）的**独立发布链**：format-v* tag 触发。
# 版本独立于 aproxy 的 alpha 线——它是示例程序，稳定后几乎不更新（更多功能
# 用户直接让 agent 写 format，见 aproxy-format skill）。
#
# 产物命名（与 aproxy 主程序同款 11 变体矩阵，互不混合）：
#   aproxy-format-<target>[-v3][.exe]  + .sha256 → GitHub Release（本 workflow）
#   npm @meowo/aproxy-format 主包 + 平台子包 → publish-format-npm job
#   crates.io aproxy-envelope + aproxy-format（envelope 先发——format 依赖它）
#     → publish-format-crates job
#
# 下载后建议落 ~/.aproxy/bin/（config.toml 的 command 指向它）。
#
# 与主线 release.yml 的隔离：本线的 Release 显式 make_latest: false，不参与
# 仓库的 Latest 标记（Latest 只留给 v* 主线稳定版）。渠道发布同样拆成可单独
# re-run 的 npm 与 crates 两个 job，「版本已存在才跳过」的判定与主线一致。

on:
  push:
    tags: ["format-v*"]

# 默认只读：test/build 会编译并运行全部依赖的 build.rs 与测试代码，不应持有
# 可写 token。只有 release-format job 提升为 contents: write（写 GitHub
# Release）；两个渠道 job 只额外申请 OIDC 的 id-token。
permissions:
  contents: read

concurrency:
  group: release-format-${{ github.ref }}
  cancel-in-progress: false # 发布绝不被并发取消

env:
  CARGO_TERM_COLOR: always
  # Linux gnu 产物能运行的最低 glibc，含义与约束同 release.yml 的同名变量：
  # 必须与 scripts/install.sh、npm/aproxy/bin/aproxy.js 的 MIN_GLIBC 一致
  # （aproxy.js 是 @meowo/aproxy 与 @meowo/aproxy-format 两组共用的转发器）。
  GNU_GLIBC_FLOOR: "2.28"

jobs:
  test-format:
    # 发布门槛：全 workspace 的 fmt/clippy/测试（format 与 aproxy 同仓同验，
    # 防止 format 发布带着 aproxy 的破损中间态）。--workspace 不可省：根目录
    # 是 aproxy 包，不带它时 clippy 与测试只覆盖 aproxy，aproxy-format 与
    # aproxy-envelope 自己的测试一项都不跑（理由见 Cargo.toml [workspace] 注释）。
    # windows 与 ubuntu 都全绿才进入构建；macOS 已知红、支持未完成，不进门禁。
    name: test-format (${{ matrix.os }})
    strategy:
      fail-fast: false # 两个平台各自跑完，一次看到全部失败面
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 不带目标过滤的 cargo test 会顺带编译 examples——transform_integration
      # 依赖已编译的 examples/format-echo
      - run: cargo test --workspace --locked --no-fail-fast

  build-format:
    needs: test-format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: .exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            variant: ""
            rustflags: ""
            ext: .exe
          # zigbuild: true：gnu 产物用 cargo-zigbuild 按 GNU_GLIBC_FLOOR 链接
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
            zigbuild: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: "-v3"
            rustflags: "-C target-cpu=x86-64-v3"
            ext: ""
            zigbuild: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            variant: ""
            rustflags: ""
            ext: ""
            zigbuild: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            variant: ""
            rustflags: ""
            ext: ""
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: ""
            rustflags: ""
            ext: ""
    name: build-format (${{ matrix.target }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # 与 release.yml 同款：zig 当链接器按 glibc 下限链接；版本钉死，升级须重新实测
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/zigbuild" \
            cargo-zigbuild==0.23.4 ziglang==0.16.0
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$RUNNER_TEMP/zigbuild/ziglang/zig" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: format-${{ matrix.target }}${{ matrix.variant }}
      # 版本对齐：format-v0.1.0 → aproxy-format/Cargo.toml 与 Cargo.lock 的
      # aproxy-format 行改为 0.1.0（只动 format 成员，aproxy/envelope 不动——
      # 三成员版本线相互独立）
      - name: Align version with tag
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          assert tag.startswith('format-v'), f"format-v* 之外的 tag 不应触发本 workflow: {tag}"
          v = tag[len('format-v'):]
          assert v, "tag 版本为空"
          toml_path = 'aproxy-format/Cargo.toml'
          toml = open(toml_path, encoding='utf-8', newline='').read()
          toml, n1 = re.subn(r'(^version = )"[^"]*"', r'\g<1>"%s"' % v, toml, count=1, flags=re.M)
          assert n1 == 1, "aproxy-format/Cargo.toml 中未找到 version 行"
          open(toml_path, 'w', encoding='utf-8', newline='').write(toml)
          lock = open('Cargo.lock', encoding='utf-8', newline='').read()
          lock, n2 = re.subn(r'(name = "aproxy-format"\r?\nversion = )"[^"]*"', r'\g<1>"%s"' % v, lock)
          assert n2 == 1, "Cargo.lock 中未找到唯一的 aproxy-format 版本行"
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(lock)
          print("aproxy-format version ->", v)
          EOF
      - name: Build
        if: ${{ !matrix.zigbuild }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        # -p aproxy-format：只构建示例二进制（workspace 内其余成员不进产物）
        run: cargo build --release --locked --target ${{ matrix.target }} -p aproxy-format
      - name: Build (cargo-zigbuild, glibc floor)
        if: matrix.zigbuild
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}.${GNU_GLIBC_FLOOR}" -p aproxy-format
      # glibc 断言与 release.yml 的同名步骤是同一段脚本（原理见那里的注释），
      # 改动须同步。aproxy-format 没有 --version：不带参数运行会打印用法并以 1
      # 退出，能看到用法文字就说明加载器已正常装载产物。
      - name: Assert glibc floor
        if: matrix.zigbuild
        shell: bash
        env:
          BIN: target/${{ matrix.target }}/release/aproxy-format
        run: |
          set -euo pipefail
          names=$(objdump -p "$BIN" | grep -oE 'GLIBC_[A-Za-z0-9_.]+' | sort -u || true)
          if [ -z "$names" ]; then
            echo "::error::$BIN 未引用任何 GLIBC_ 符号版本，不像 glibc 动态链接产物"
            exit 1
          fi
          echo "$BIN 的 glibc 版本需求：$(tr '\n' ' ' <<<"$names")"
          odd=$(printf '%s\n' "$names" | grep -vE '^GLIBC_[0-9]+(\.[0-9]+)*$' || true)
          if [ -n "$odd" ]; then
            echo "::error::$BIN 含非数字的 glibc 版本需求：$(tr '\n' ' ' <<<"$odd")"
            exit 1
          fi
          max=$(printf '%s\n' "$names" | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          top=$(printf '%s\n%s\n' "$max" "$GNU_GLIBC_FLOOR" | sort -V | tail -n 1)
          if [ "$top" != "$GNU_GLIBC_FLOOR" ]; then
            echo "::error::$BIN 需要 GLIBC_$max，高于约定下限 GLIBC_$GNU_GLIBC_FLOOR"
            exit 1
          fi
          echo "最高 GLIBC_$max <= 下限 GLIBC_$GNU_GLIBC_FLOOR：通过"
          out=$("$BIN" 2>&1 < /dev/null || true)
          case "$out" in
            *用法*) echo "试跑通过：$out" ;;
            *) echo "::error::$BIN 试跑失败：$out"; exit 1 ;;
          esac
      - name: Stage asset
        shell: pwsh
        env:
          ASSET: aproxy-format-${{ matrix.target }}${{ matrix.variant }}${{ matrix.ext }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aproxy-format${{ matrix.ext }}" "dist/$env:ASSET"
          $hash = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -NoNewline -Encoding ascii "dist/$env:ASSET.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: format-bin-${{ matrix.target }}${{ matrix.variant }}
          path: dist

  release-format:
    needs: build-format
    runs-on: ubuntu-latest
    # 本 workflow 唯一需要写仓库的 job：创建 Release 并上传资产
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release body
        run: |
          cd artifacts
          {
            echo "## aproxy-format（官方示例 format 程序）"
            echo ""
            echo "aProxy 外部转换器（\`request_transform\`/\`response_transform\`）的官方示例：协议转换（OpenAI ↔ Anthropic 等）、apikey 轮换/加权轮换、多模型多渠道聚合。用法见随 aProxy 分发的 aproxy-format skill。"
            echo ""
            echo "- **下载**：按平台选 \`aproxy-format-<target>[-v3]\`，建议落 \`~/.aproxy/bin/aproxy-format\`"
            echo "- **npm**：\`npm install -g @meowo/aproxy-format\`（含全平台预编译包，装后直接在 PATH）"
            echo "- **版本独立于 aProxy 主程序**：示例程序，稳定后几乎不更新（更多功能直接让 agent 写 format）"
            echo ""
            echo "## SHA256"
            echo ""
            echo "| 文件 | SHA256 |"
            echo "|---|---|"
            for f in *.sha256; do
              h=$(cut -d' ' -f1 "$f")
              a=$(cut -d' ' -f2- "$f" | sed 's/^ *//')
              echo "| \`$a\` | \`$h\` |"
            done
          } > ../release_body.md
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*
          body_path: release_body.md
          generate_release_notes: true
          # 预发布判定与 release.yml 的同名输入、npm/build-and-publish.sh 的
          # npm_dist_tag() 是同一条规则（含 -alpha/-beta/-rc 即预发布），改动须同步
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          # format 线永不成为仓库 Latest：Latest 与 /releases/latest 只属于 v* 主线。
          # 不写时 GitHub 默认把新发布的非预发布 Release 标为 Latest
          # （format-v0.1.0 就因此占了 Latest）。
          make_latest: false

  publish-format-npm:
    # npm 渠道（@meowo/aproxy-format 主包 + 平台子包）：build-and-publish.sh
    # 逐包先查询版本是否已存在，已存在则跳过，失败后可单独 re-run 本 job
    needs: release-format
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # npm 组包从合并的 artifact 目录取平台二进制（ASSET_DIR=artifacts）——
      # 缺此步组包脚本找不到资产，format 渠道发布必然失败
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish npm packages（aproxy-format 主包 + 平台子包）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # 组名参数化：format = @meowo/aproxy-format 包组
        run: bash npm/build-and-publish.sh format

  publish-format-crates:
    # crates.io 渠道：与 publish-format-npm 并行、互不依赖，可以单独 re-run。
    # 认证同 release.yml 的 publish-crates（OIDC 换短期 token，|| 兜底 secret）。
    needs: release-format
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Align version with tag (publish)
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          assert tag.startswith('format-v'), f"format-v* 之外的 tag 不应触发本 workflow: {tag}"
          v = tag[len('format-v'):]
          toml_path = 'aproxy-format/Cargo.toml'
          toml = open(toml_path, encoding='utf-8', newline='').read()
          toml, n1 = re.subn(r'(^version = )"[^"]*"', r'\g<1>"%s"' % v, toml, count=1, flags=re.M)
          assert n1 == 1, "aproxy-format/Cargo.toml 中未找到 version 行"
          open(toml_path, 'w', encoding='utf-8', newline='').write(toml)
          lock = open('Cargo.lock', encoding='utf-8', newline='').read()
          lock, n2 = re.subn(r'(name = "aproxy-format"\r?\nversion = )"[^"]*"', r'\g<1>"%s"' % v, lock)
          assert n2 == 1, "Cargo.lock 中未找到唯一的 aproxy-format 版本行"
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(lock)
          print("aproxy-format version ->", v)
          EOF
      # 幂等判定与 release.yml 的 publish-crates 同一套逻辑（原理见那里的注释），
      # 改动须同步。envelope 版本独立于 format：format 发新版而 envelope 未变时
      # （常态），envelope 查得 200 被跳过，只发 aproxy-format。
      - name: Plan crates to publish
        id: plan
        shell: bash
        env:
          CRATES: aproxy-envelope aproxy-format
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --locked --format-version 1)
          args=""
          for c in $CRATES; do
            v=$(printf '%s' "$meta" | python3 -c 'import json, sys; n = sys.argv[1]; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == n))' "$c")
            code=$(curl -sS --retry 3 -o crates-io-resp.json -w '%{http_code}' \
              -A "aProxy-release (https://github.com/MoYeRanqianzhi/aProxy)" \
              "https://crates.io/api/v1/crates/$c/$v") || {
              echo "::error::查询 crates.io 上的 $c@$v 失败（网络错误）"
              exit 1
            }
            case "$code" in
              200) echo "$c@$v 已在 crates.io，跳过" ;;
              404) echo "$c@$v 尚未发布，列入待发布"; args="$args -p $c" ;;
              *)
                echo "::error::查询 crates.io 上的 $c@$v 返回 HTTP $code"
                cat crates-io-resp.json
                exit 1
                ;;
            esac
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
          [ -n "$args" ] || echo "全部 crate 的当前版本都已在 crates.io，无需发布"
      # 多个 -p 时 cargo（1.90+）按依赖顺序打包，并用本地刚打好的包校验后续包
      - name: Dry run
        if: steps.plan.outputs.args != ''
        run: cargo publish --dry-run --locked --allow-dirty ${{ steps.plan.outputs.args }}
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        if: steps.plan.outputs.args != ''
        id: crates-auth
      - name: Publish to crates.io
        if: steps.plan.outputs.args != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty：工作区被对齐步骤有意改为 tag 版本（对齐产物），非意外
        run: cargo publish --locked --allow-dirty ${{ steps.plan.outputs.args }}
