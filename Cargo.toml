# workspace 四成员：aproxy（本包）/ aproxy-format（官方示例 format 二进制）/
# aproxy-envelope（信封契约 crate，两二进制共同类型单源维护）/ aproxy-desktop
# （桌面界面：Tauri 2 外壳与嵌入的前端，aproxy 的 desktop 特性引入它）。
# aproxy-format 与 aproxy 的依赖树完全隔离——switchyard-translation 不会进入 aproxy
# 的编译闭包，「aproxy 本体体积不受影响」由此保证。
#
# 有意不设 default-members：根目录本身是 aproxy 包，所以不带 -p/--workspace 的
# cargo 命令只作用于 aproxy。测试与 lint 必须显式带 --workspace 才覆盖全部
# 成员（CI 与两条发版门禁都这样写）：
#   cargo test --workspace --locked
#   cargo clippy --workspace --all-targets --locked -- -D warnings
# 无界面的 headless 变体再排除 aproxy-desktop——它是成员，--workspace 会把它当作
# 选中的包编译，--no-default-features 管不到它：
#   cargo test --workspace --exclude aproxy-desktop --no-default-features --locked
# 若把成员都设成 default-members，裸 `cargo run` 会因存在 aproxy 与
# aproxy-format 两个二进制而报「could not determine which binary to run」；
# 源码构建用的裸 `cargo build` 也会连带编译 aproxy-format，并按它的
# rust-version 1.96.1 拒绝更旧的工具链，而 aproxy 本身只要求 1.90。
[workspace]
members = [".", "aproxy-envelope", "aproxy-format", "aproxy-desktop"]
resolver = "3"

[package]
name = "aproxy"
version = "0.2.0-alpha.0"
# edition 2024 本身要 1.85，依赖树把下限抬到 1.88：src/decode.rs 引入的 ruzstd
# 要 1.87，url→idna→idna_adapter 拖进来的 icu_* 一族要 1.88（这些 crate 在依赖图里
# 是实打实被编译的，非可选）。本包自己再抬到 1.89：安装锁（永久兼容契约 C4 的
# `<home>/install/lock`）用标准库的 File::lock / try_lock，它们在 1.89 稳定——Windows
# 上是 LockFileEx，unix 上是 flock，进程死亡时由操作系统自动释放，不需要自己写平台
# 代码。默认的 desktop 特性再抬到 1.90：tauri 一族都声明 rust-version 1.90（见
# aproxy-desktop/Cargo.toml）。headless（--no-default-features）实际 1.89 就能编，但
# rust-version 只能写一个值，按默认构建写。声明出来，旧工具链会得到一条明确的
# 「rustc 1.90 或更新」报错，而不是一堆看不懂的编译失败。
rust-version = "1.90"
edition = "2024"
description = "Local API proxy with infinite retries for agent workloads"
license = "MIT"
authors = ["aProxy Contributors"]
repository = "https://github.com/MoYeRanqianzhi/aProxy"
keywords = ["proxy", "retry", "api", "agent", "claude-code"]
categories = ["network-programming", "web-programming"]
# crates.io 白名单：crate 只装代码与文档，仓库其余（bench/文档树/工作流）不进包。
# 前导 / 锚定仓库根——不带 / 的模式（如 README.md）会按 gitignore 语义匹配
# 任意层级（实测 npm/ 子目录的 README 混进过包）
# build.rs 必须在白名单里：它导出的编译期常量（目标三元组）是代码的一部分，
# 缺了它 crates.io 上的包（以及 install 的 cargo 渠道）编译不过。
include = ["/src/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/.claude/skills/aproxy-cli/**", "/.claude/skills/aproxy-format/**"]

[[bin]]
name = "aproxy"
path = "src/main.rs"

# cargo-binstall：发布资产的命名（带界面的 `aproxy-<target>[.exe]`，裸二进制）正好命中它内置的
# 默认地址，主体不用配置。musl 目标没有带界面的版本，只发布 `aproxy-headless-<target>`，这里按
# 目标给它指路（逐个写目标名而不用 cfg 表达式：旧版 cargo-binstall 不认 cfg）。其余平台要无界面
# 版本时，用户在命令行给 --pkg-url（见 README）。install 的 cargo-binstall 渠道只读
# [package.metadata.binstall] 本身、不读 overrides，无界面版本的地址由它自己拼。
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-headless-{ target }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-headless-{ target }{ binary-ext }"
pkg-fmt = "bin"

# 发布变体：desktop = 带桌面界面的版本（默认），`--no-default-features` 出无界面的
# headless 版本，不多出任何依赖（CI 用 cargo tree 断言依赖树里没有 tauri）。
# `aproxy --version` 的变体段按它输出 desktop 或 headless（src/lib.rs 的
# VERSION_LINE），安装器升级时靠这一段保持变体不变。
#
# 只有 bin 引用 aproxy_desktop，而且只在非测试构建里（main.rs 与 commands/desktop.rs
# 的 #[cfg(all(feature = "desktop", not(test)))]）；lib 永不引用它。rustc 不链接没被
# 引用的依赖，所以 lib 与 bin 的单元测试、tests/ 下的集成测试都不链接 Tauri，测试在
# Windows 上能不能启动就不取决于 Common-Controls 清单怎样传递（RT-05，见
# aproxy-desktop/Cargo.toml）。
[features]
default = ["desktop"]
desktop = ["dep:aproxy-desktop"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# 下限写到实测过的 0.8.23，不只写 0.8：Linux 上 tauri 的 GTK3 一族经 glib-macros 引入
# proc-macro-crate 2.0，它的 2.0.1、2.0.2 精确依赖 toml_datetime =0.6.3 与 toml_edit =0.20.2。
# 只写 0.8 时，不带锁文件的解析（不加 --locked 的 `cargo install aproxy`）会挑 proc-macro-crate
# 2.0.2、把这里的 toml 退回 0.8.2，一个从没测过的组合；有了这条下限，解析器只能改挑
# proc-macro-crate 2.0.0（它只要求 toml_edit ^0.20.2）。锁文件级的解析按全部特性、全部目标
# 平台进行，所以 Windows 与 headless 的安装同样受它保护。
toml = "0.8.23"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
http-body-util = "0.1"
futures-util = "0.3"
http = "1"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# install 下载校验：github 渠道 .sha256 强校验 / npm integrity 换算 / --from 完整性记录
sha2 = "0.10"
# install 下载链条：npm/cargo 渠道的 tgz/.crate 解包 + 版本比较（降级防呆）
tar = "0.4"
flate2 = "1"
semver = "1"
# skill 更新支线：GitHub skills 资产的 zip 解包
zip = { version = "2", default-features = false, features = ["deflate"] }
# 受限重试路径（config.toml bounded_retry_paths）：用户配置的正则模式，
# 命中的请求失败达尝试上限即透传。纯正则引擎，无 C 依赖，musl/aarch64
# 交叉编译与 CI 不受影响。
regex = "1"
# 外部转换器信封契约（src/transform.rs）：与 aproxy-format 二进制共同类型
# 单源维护（workspace 成员），path 依赖不进 crates.io 发布（publish 时换
# version 依赖，见 release 说明）
aproxy-envelope = { version = "0.2.0", path = "aproxy-envelope" }
# 桌面界面（desktop 特性）：Tauri 外壳与嵌入的前端。version + path 双写，理由同上；
# 版本与本包同步。它不依赖本包（否则成环），需要的东西（home、运行时）由 bin 在启动
# 界面时传进去。版本要求用 `=` 精确钉住：两者总是同号一起发布，aproxy-desktop 的接口
# 只为同号的 aproxy 服务、不守 semver，不带 --locked 的 `cargo install aproxy` 不能挑到
# 别的版本。发布前 .github/scripts/align-version.py 按正则把这一行与两边的版本一起改成
# tag 版本：改这一行的写法（换行、调换键的顺序）要同步改那个脚本，否则发布在对齐这步失败。
aproxy-desktop = { version = "=0.2.0-alpha.0", path = "aproxy-desktop", optional = true }
# 响应体检查用解码器（src/decode.rs）：把压缩响应解出一份副本供「错误判定 +
# 日志预览」使用——转发给客户端的字节始终是上游原样，本模块不参与转发路径。
# 两者均为**纯 Rust**实现（无 C 依赖，故 musl/aarch64 交叉编译与 CI 各平台不受
# 影响）；gzip/deflate 复用上面的 flate2，不重复引依赖。
#
# br 直接依赖解码器 crate 而非门面包 brotli：门面包把**编码器**和**解码器**编在
# 同一个库里，没有只留解码器的特性（它的 default = ["std"] 同时控制两者的 std
# 接口，关掉 default 会让 Decompressor 与 CompressorWriter 一起消失），生产路径
# 却只用 Decompressor。故常规依赖取纯解码器，编码器只在单测里造样本，放
# dev-dependencies——二进制不再编译编码器那一半。两者版本有约束关系：brotli
# 9.0.0 依赖 `brotli-decompressor ~6.0`，升 brotli 时需核对本行。
brotli-decompressor = "6.0.0"
ruzstd = "0.9.0"

[target.'cfg(windows)'.dependencies]
# spawn_detached 手写 CreateProcessW（bInheritHandles=FALSE，std 无稳定 API 可关）。
# 精确钉死 =0.52.0：HANDLE 在 windows-sys 0.59+ 从 isize 改为 *mut c_void，
# 本仓库句柄逻辑（看门狗/force_terminate）全部按 isize 书写；CI 首跑曾观察到
# ^0.52 被解析为 0.61.2（本地同款 lock 解析 0.52.0 正常，机制未定位），
# 精确钉死 + CI --locked 双保险根除解析漂移。
# Win32_System_Memory：看门狗共享内存心跳节（CreateFileMappingW/MapViewOfFile）。
# Win32_System_Pipes：控制管道客户端核对服务端进程（GetNamedPipeServerProcessId）。
# Win32_Storage_FileSystem：交换时旧二进制让位用 MoveFileExW 且不带
# MOVEFILE_REPLACE_EXISTING——std::fs::rename 在 Windows 上会覆盖已存在的目标，
# 唯一中间名（永久兼容契约 C2）要的是「目标已存在就失败」。
# Win32_System_Diagnostics_ToolHelp：强制安装最后报告「从 bin 运行、却不在台账里」
# 的进程时枚举全部进程（CreateToolhelp32Snapshot）。
# Win32_System_IO：安装锁直接调用 LockFileEx / UnlockFileEx（它们的 OVERLAPPED 参数在
# 这个 feature 里）——锁原语是永久兼容契约 C4，不经 std 的 File::try_lock。
# Win32_UI_Shell、Win32_System_Com：USERPROFILE 为空时按 FOLDERID_Profile 取用户目录
# （SHGetKnownFolderPath，结果用 CoTaskMemFree 释放）——home 的算法是永久兼容契约 C1。
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
# 进程台账（src/ledger.rs）结束进程时要用的系统调用：Linux 的 pidfd_open /
# pidfd_send_signal（经 libc::syscall 与 SYS_* 常量）、macOS 的 proc_pidinfo（读
# proc_bsdinfo 的启动时刻）。用 libc 而不是像别处那样手写 extern "C"：proc_bsdinfo
# 的结构体布局与各架构的系统调用号手抄容易抄错，而 libc 已经经 tokio 在依赖图里，
# 不增加编译闭包。
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# 仅测试用：造 brotli 压缩样本需要编码器（CompressorWriter），生产路径不需要。
# 放在这里既让 `cargo test` 拿得到，又让常规/release 构建完全不编译编码器。
brotli = "9.0.0"

# release 优化：代理是网络 IO 密集型（转发时间花在等上游/等客户端，CPU 占比
# 极低），speed 与 size 基本不冲突，可兼得：
# - lto="fat" + codegen-units=1：跨 crate 全量优化，热路径内联与死代码消除
#   最大化（speed+size 双收益），代价是编译时间显著变长——release 构建不
#   频繁，可接受
# - opt-level="z"：对 IO 密集负载的吞吐无可测影响，二进制却显著更小
# - panic 保持默认 unwind（不设 panic="abort"）：axum/hyper 每连接是独立
#   tokio 任务，handler panic 时 unwind 只断该连接、实例继续服务；abort 会
#   让任何一处 bug 杀掉整个实例——对「无限重试不间断」的使命与依赖本代理
#   的 agent 会话是严重回退。实测 abort 可再省 32% 体积（4.06→2.77MB），
#   但那是磁盘占用不是运行性能；若未来采用 abort，必须配套看门狗自动重启，
#   且重启窗口期全连接断流仍劣于连接级隔离
# - strip=true：符号/调试信息不参与运行（排查 backtrace 用 dev 构建复现）
# - target-cpu 不设：构建产物会分发到不同机器，native 指令集会在他机直接
#   非法指令崩溃
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true

# 调试构建（cargo build、cargo test）只带行号表：回溯照样有文件与行号，调试器里看不到局部
# 变量（要看就临时设 CARGO_PROFILE_DEV_DEBUG=full）。强制安装的集成测试把调试版的 aproxy 当作
# 发布资产来下载，它得小于资产的大小上限（src/install/force.rs 的 ASSET_LIMIT，256 MiB）；带着
# 完整调试信息时，Linux 上带界面的调试版（Tauri 与 GTK 一族）超过了它。调试信息少了，链接也更快、
# 更省内存。
[profile.dev]
debug = "line-tables-only"
